name: CI

# Static checks only (lint + version sync). The test suites run on the maintainer's machine before
# each release; hosted runners never run them (release-audit check hosted-ci-static).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: claude-code-boss/package-lock.json

      - name: Install dependencies (no native builds; lint needs none)
        run: npm ci --ignore-scripts
        working-directory: claude-code-boss

      - name: Static gate (eslint + version sync)
        run: node scripts/gate.mjs --static
        working-directory: claude-code-boss
