name: Deploy Pages

# Publica pages/ no GitHub Pages via Actions. Roda quando as páginas mudam
# (após o merge na main) e pode ser disparado manualmente. Independente do
# pages-guard: o guard barra páginas desatualizadas; este só publica.
#
# Dois jobs (o modelo oficial do GitHub): no job único, o deploy consultava os
# artefatos ~0,4 s depois do upload e às vezes não os via ainda ("Found 0
# artifact(s)"); re-rodar o job no MESMO run deixava dois "github-pages" e o
# deploy recusava. Com o deploy num job seguinte, o artefato já está registrado.

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
