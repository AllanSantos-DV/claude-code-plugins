name: Deploy Pages

# Publica pages/ na branch gh-pages quando as páginas mudam (após o merge na main) e pode ser disparado
# manualmente. Fonte do Pages = "Deploy from a branch", gh-pages, "/": sem artefato do Actions (o
# upload/deploy-pages falhou por consistência de artefato e depende da cota de armazenamento). O push usa a chave de
# deploy PAGES_DEPLOY_KEY (push com GITHUB_TOKEN não dispara a publicação) e o job falha se a página no ar não
# mostrar a versão do plugin. Independente do pages-guard: o guard barra páginas desatualizadas; este só publica.
# Reverter: AGENTS.md, "Publicação por branch".

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - '.github/scripts/pages-publish.mjs'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Publish pages/ to gh-pages
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: node .github/scripts/pages-publish.mjs publish --message "Pages ${GITHUB_SHA::7}"

      - name: The public page shows this version
        run: node .github/scripts/pages-publish.mjs verify --stamp "$GITHUB_SHA"
